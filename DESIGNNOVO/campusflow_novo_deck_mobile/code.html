<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusFlow - Novo Deck</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed-variant": "#39485a",
                        "on-background": "#191c1e",
                        "on-primary-fixed-variant": "#3c475a",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "primary": "#091426",
                        "border-subtle": "#E2E8F0",
                        "text-high-contrast": "#0F172A",
                        "outline": "#75777d",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed": "#d4e4fa",
                        "surface-container": "#eceef0",
                        "surface-bright": "#f7f9fb",
                        "on-surface-variant": "#45474c",
                        "background": "#f7f9fb",
                        "surface-alt": "#E8EAF0",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f7f9fb",
                        "error": "#ba1a1a",
                        "primary-container": "#1e293b",
                        "outline-variant": "#c5c6cd",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-dim": "#d8dadc",
                        "primary-fixed": "#d8e3fb",
                        "on-secondary-container": "#54647a",
                        "surface-container-high": "#e6e8ea",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#1b2a3b",
                        "tertiary-fixed-dim": "#b9c8de",
                        "surface-variant": "#e0e3e5",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#8291a6",
                        "secondary": "#505f76",
                        "secondary-container": "#d0e1fb",
                        "inverse-primary": "#bcc7de",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary": "#061525",
                        "surface-tint": "#545f73",
                        "primary-fixed-dim": "#bcc7de",
                        "inverse-surface": "#2d3133",
                        "on-tertiary-fixed": "#0d1c2d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-container": "#8590a6",
                        "on-primary-fixed": "#111c2d",
                        "on-surface": "#191c1e",
                        "on-tertiary": "#ffffff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "margin-page": "64px",
                        "stack-md": "24px",
                        "section-gap": "80px",
                        "stack-lg": "48px",
                        "unit": "8px",
                        "stack-sm": "12px",
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "label-md": ["12px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "600" }],
                        "label-sm": ["11px", { lineHeight: "1", fontWeight: "500" }],
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-sm": ["20px", { lineHeight: "1.4", fontWeight: "500" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean minimal look on discipline selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col selection:bg-secondary-container selection:text-on-secondary-container overflow-hidden">
<!-- Mobile Top App Bar (Simplified for context) -->
<header class="w-full h-16 bg-background flex items-center justify-between px-6 z-10 shrink-0 md:hidden">
<button aria-label="Voltar" class="text-on-surface-variant p-2 -ml-2 rounded-full active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-sm text-headline-sm font-bold text-primary">Novo Deck</div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-6 pt-4 pb-32 no-scrollbar relative w-full max-w-md mx-auto">
<!-- Form Container -->
<form class="flex flex-col gap-stack-lg">
<!-- Deck Name Input -->
<div class="flex flex-col gap-unit group">
<label class="font-label-md text-label-md text-on-surface-variant transition-colors group-focus-within:text-primary" for="deck-name">
                    NOME DO DECK
                </label>
<input class="w-full bg-transparent border-0 border-b border-border-subtle py-2 px-0 font-body-lg text-body-lg text-on-background placeholder:text-outline-variant focus:ring-0 focus:border-primary focus:border-b-2 transition-all" id="deck-name" placeholder="Ex: Anatomia Sistema Nervoso" type="text"/>
</div>
<!-- Discipline Selector -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant">
                    DISCIPLINA
                </label>
<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 -mx-6 px-6">
<!-- Selected State -->
<button class="shrink-0 px-4 py-2 rounded-full border border-primary bg-primary text-on-primary font-label-md text-label-md transition-colors" type="button">
                        Medicina
                    </button>
<!-- Unselected States -->
<button class="shrink-0 px-4 py-2 rounded-full border border-border-subtle text-on-surface-variant hover:bg-surface-container-low active:bg-surface-container-high font-label-md text-label-md transition-colors" type="button">
                        Direito
                    </button>
<button class="shrink-0 px-4 py-2 rounded-full border border-border-subtle text-on-surface-variant hover:bg-surface-container-low active:bg-surface-container-high font-label-md text-label-md transition-colors" type="button">
                        Engenharia
                    </button>
<button class="shrink-0 px-4 py-2 rounded-full border border-border-subtle text-on-surface-variant hover:bg-surface-container-low active:bg-surface-container-high font-label-md text-label-md transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">add</span>
                        Nova
                    </button>
</div>
</div>
<!-- First Card Simplified Area -->
<div class="mt-4 flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">
                        PRIMEIRO CARD (OPCIONAL)
                    </label>
<span class="material-symbols-outlined text-outline-variant text-[18px]">info</span>
</div>
<div class="bg-surface-alt border border-border-subtle rounded-xl p-6 flex flex-col gap-stack-md">
<!-- Front -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant opacity-70">FRENTE</label>
<textarea class="w-full bg-transparent border-0 border-b border-border-subtle py-2 px-0 font-body-md text-body-md text-on-background placeholder:text-outline-variant focus:ring-0 focus:border-primary transition-all resize-none" placeholder="Pergunta ou conceito base..." rows="2"></textarea>
</div>
<!-- Back -->
<div class="flex flex-col gap-unit mt-2">
<label class="font-label-sm text-label-sm text-on-surface-variant opacity-70">VERSO</label>
<textarea class="w-full bg-transparent border-0 border-b border-border-subtle py-2 px-0 font-body-md text-body-md text-on-background placeholder:text-outline-variant focus:ring-0 focus:border-primary transition-all resize-none" placeholder="Resposta, explicação detalhada..." rows="3"></textarea>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Action Area (Above Bottom Nav) -->
<div class="fixed bottom-[72px] left-0 w-full px-6 py-4 bg-gradient-to-t from-background via-background to-transparent z-40 md:hidden flex justify-center">
<button class="w-full max-w-md bg-primary-container text-on-primary py-4 rounded-xl font-label-md text-label-md uppercase tracking-wider shadow-sm hover:bg-primary transition-colors active:scale-[0.98]">
            Criar Deck
        </button>
</div>
<!-- Bottom Navigation Bar (Shared Component) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center py-2 bg-surface-container-lowest border-t border-border-subtle md:hidden h-[72px] pb-safe">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 ease-in-out p-2 rounded-lg w-16 group">
<span class="material-symbols-outlined mb-1 group-active:scale-95 transition-transform" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<!-- Tasks (Active - Semantically closest to creating something new) -->
<button class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-container-low transition-colors duration-200 ease-in-out p-2 rounded-lg w-16 group">
<span class="material-symbols-outlined mb-1 icon-fill group-active:scale-95 transition-transform" data-icon="checklist" data-weight="fill">checklist</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</button>
<!-- Focus (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 ease-in-out p-2 rounded-lg w-16 group">
<span class="material-symbols-outlined mb-1 group-active:scale-95 transition-transform" data-icon="potted_plant">potted_plant</span>
<span class="font-label-sm text-label-sm">Focus</span>
</button>
<!-- Stats (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 ease-in-out p-2 rounded-lg w-16 group">
<span class="material-symbols-outlined mb-1 group-active:scale-95 transition-transform" data-icon="leaderboard">leaderboard</span>
<span class="font-label-sm text-label-sm">Stats</span>
</button>
</nav>
<style>
        /* Ensure safe area padding for modern mobile devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</body></html>

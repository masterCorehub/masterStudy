<script>
        // Auto-resize textarea logic (simulated for initial content)
        const textarea = document.querySelector('textarea');
        
        const initialContent = `Para funções de duas ou mais variáveis, a derivada parcial mede como a função muda quando uma das variáveis varia, enquanto as outras são mantidas constantes.

Definição Matemática:
Para uma função f(x, y), a derivada parcial em relação a x é denotada como ∂f/∂x ou f_x.
∂f/∂x = lim(h->0) [f(x+h, y) - f(x, y)] / h

Regra Prática:
1. Para derivar em relação a 'x', trate 'y' como uma constante.
2. Para derivar em relação a 'y', trate 'x' como uma constante.

Exemplo 1:
Seja f(x,y) = 3x²y + 5y³

Derivada parcial em x (∂f/∂x):
Tratando y como constante...
∂f/∂x = 6xy + 0 = 6xy

Derivada parcial em y (∂f/∂y):
Tratando x como constante...
∂f/∂y = 3x² + 15y²

Nota: O Teorema de Clairaut afirma que as derivadas parciais mistas (f_xy e f_yx) são iguais se forem contínuas no ponto.`;

        textarea.value = initialContent;
        
        // Adjust height on input
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        
        // Trigger initial resize
        setTimeout(() => {
             textarea.style.height = (textarea.scrollHeight) + 'px';
        }, 100);
    </script>

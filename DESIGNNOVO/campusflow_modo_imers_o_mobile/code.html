<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusFlow - Immersion Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#091426",
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-on-surface": "#eff1f3",
                        "text-high-contrast": "#0F172A",
                        "tertiary-fixed-dim": "#b9c8de",
                        "tertiary": "#061525",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed": "#111c2d",
                        "surface-tint": "#545f73",
                        "on-tertiary-fixed-variant": "#39485a",
                        "on-secondary-container": "#54647a",
                        "surface": "#f7f9fb",
                        "inverse-primary": "#bcc7de",
                        "primary-fixed-dim": "#bcc7de",
                        "tertiary-container": "#1b2a3b",
                        "tertiary-fixed": "#d4e4fa",
                        "on-error": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-alt": "#E8EAF0",
                        "secondary": "#505f76",
                        "border-subtle": "#E2E8F0",
                        "on-surface-variant": "#45474c",
                        "secondary-fixed": "#d3e4fe",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eceef0",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d0e1fb",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed": "#0d1c2d",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#d8e3fb",
                        "on-primary-fixed-variant": "#3c475a",
                        "outline": "#75777d",
                        "surface-dim": "#d8dadc",
                        "error": "#ba1a1a",
                        "on-primary-container": "#8590a6",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-tertiary-container": "#8291a6",
                        "primary-container": "#1e293b",
                        "surface-container-highest": "#e0e3e5",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c5c6cd",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-md": "24px",
                        "margin-page": "64px",
                        "stack-sm": "12px",
                        "gutter": "24px",
                        "unit": "8px",
                        "stack-lg": "48px",
                        "section-gap": "80px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for minimalism */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        
        .glass-panel {
            background: rgba(247, 249, 251, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #E2E8F0;
        }

        .dot-pattern {
            background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md dot-pattern relative">
<!-- TopNav - Suppressed per rules (Immersion Mode is a focused journey) -->
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative w-full h-full p-stack-sm pb-24 z-10 overflow-y-auto">
<!-- Video / Main Content Module -->
<section class="glass-panel rounded-xl flex-shrink-0 flex flex-col overflow-hidden mb-stack-md shadow-sm">
<header class="flex items-center justify-between p-3 border-b border-border-subtle bg-surface-container-lowest">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">play_circle</span>
<h2 class="font-label-md text-label-md text-primary">Aula</h2>
</div>
<div class="flex items-center gap-3 text-secondary">
<span class="material-symbols-outlined text-[16px] cursor-pointer hover:text-primary transition-colors">remove</span>
<span class="material-symbols-outlined text-[16px] cursor-pointer hover:text-primary transition-colors">crop_square</span>
</div>
</header>
<div class="relative w-full aspect-video bg-surface-alt flex flex-col items-center justify-center p-stack-md border-b border-border-subtle border-dashed m-3 rounded-lg">
<span class="material-symbols-outlined text-[48px] text-secondary mb-4 opacity-50">smart_display</span>
<h3 class="font-headline-sm text-headline-sm text-primary mb-2">Sem aula em vídeo</h3>
<p class="font-body-sm text-body-sm text-secondary text-center max-w-[280px] mb-6">
                    Adicione um arquivo local ou link do YouTube para usar este painel.
                </p>
<div class="flex gap-3">
<button class="bg-primary text-on-primary font-label-md text-label-md px-4 py-2 rounded-lg hover:bg-opacity-90 transition-colors">
                        Adicionar arquivo
                    </button>
<button class="border border-secondary text-secondary font-label-md text-label-md px-4 py-2 rounded-lg hover:bg-surface-alt transition-colors">
                        Adicionar link
                    </button>
</div>
</div>
</section>
<!-- Stackable Modules Area -->
<div class="flex flex-col gap-stack-sm flex-1">
<!-- Notes Module -->
<section class="glass-panel rounded-xl flex flex-col shadow-sm">
<header class="flex items-center justify-between p-3 border-b border-border-subtle bg-surface-container-lowest">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">edit_note</span>
<h2 class="font-label-md text-label-md text-primary">Anotações</h2>
</div>
<span class="material-symbols-outlined text-[16px] text-secondary cursor-pointer">remove</span>
</header>
<div class="p-3 flex flex-col gap-3">
<div class="border border-border-subtle rounded-lg p-3 bg-surface-container-lowest focus-within:border-primary transition-colors">
<input class="w-full bg-transparent border-none outline-none font-label-md text-label-md text-primary placeholder:text-secondary mb-2 p-0 focus:ring-0" placeholder="Título da nota..." type="text"/>
<textarea class="w-full bg-transparent border-none outline-none font-body-sm text-body-sm text-secondary placeholder:text-secondary resize-none h-20 p-0 focus:ring-0" placeholder="Digite uma nota rápida..."></textarea>
<div class="flex justify-between items-center mt-2 pt-2 border-t border-border-subtle">
<span class="font-label-sm text-label-sm text-secondary">Sem tempo ativo</span>
<button class="bg-primary text-on-primary font-label-sm text-label-sm px-3 py-1.5 rounded-lg">Salvar nota</button>
</div>
</div>
</div>
</section>
<!-- PDF Module (Minimized state representation) -->
<section class="glass-panel rounded-xl flex flex-col shadow-sm">
<header class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-xl cursor-pointer hover:bg-surface-alt transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">picture_as_pdf</span>
<h2 class="font-label-md text-label-md text-primary">PDF</h2>
</div>
<span class="material-symbols-outlined text-[16px] text-secondary">expand_more</span>
</header>
</section>
<!-- Audio Module (Minimized state representation) -->
<section class="glass-panel rounded-xl flex flex-col shadow-sm">
<header class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-xl cursor-pointer hover:bg-surface-alt transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-secondary">headphones</span>
<h2 class="font-label-md text-label-md text-primary">Audio</h2>
</div>
<span class="material-symbols-outlined text-[16px] text-secondary">expand_more</span>
</header>
</section>
</div>
</main>
<!-- Floating Tools (Bottom Action Area) -->
<div class="fixed bottom-0 left-0 w-full p-4 z-50 pointer-events-none flex justify-center items-end">
<div class="glass-panel rounded-full p-2 flex gap-2 pointer-events-auto shadow-sm items-center">
<button class="w-10 h-10 rounded-full bg-surface-alt flex items-center justify-center text-primary hover:bg-secondary-container transition-colors relative group">
<span class="material-symbols-outlined text-[20px]">search</span>
<div class="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 bg-surface text-on-surface text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity border border-border-subtle">Buscar (Ctrl K)</div>
</button>
<div class="w-px h-6 bg-border-subtle mx-1"></div>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-opacity-90 transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-alt flex items-center justify-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">brush</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-alt flex items-center justify-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">pan_tool</span>
</button>
</div>
</div>
<!-- Right Side Floating Panel (Tools Menu) -->
<div class="fixed right-4 top-1/2 -translate-y-1/2 z-40 glass-panel rounded-full p-2 flex flex-col gap-3 shadow-sm">
<button class="w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
<button class="w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
<button class="w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors relative">
<span class="material-symbols-outlined text-[18px]">book</span>
<span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
</button>
</div>
</body></html>

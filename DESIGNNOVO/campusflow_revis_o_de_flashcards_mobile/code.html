<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusFlow - Revisão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            theme: {
                extend: {

                        "on-primary-container": "#8590a6",
                        "outline": "#75777d",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed": "#0d1c2d",
                        "tertiary-fixed-dim": "#b9c8de",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface": "#191c1e",
                        "secondary": "#505f76",
                        "primary-fixed": "#d8e3fb",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#d4e4fa",
                        "tertiary-container": "#1b2a3b",
                        "on-secondary-container": "#54647a",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-tint": "#545f73",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#3c475a",
                        "primary": "#091426",
                        "inverse-primary": "#bcc7de",
                        "on-tertiary-container": "#8291a6",
                        "surface-container": "#eceef0",
                        "on-surface-variant": "#45474c",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#111c2d",
                        "secondary-container": "#d0e1fb",
                        "surface-variant": "#e0e3e5",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed-variant": "#39485a",
                        "tertiary": "#061525",
                        "surface-container-high": "#e6e8ea",
                        "secondary-fixed": "#d3e4fe",
                        "on-error": "#ffffff",
                        "on-background": "#191c1e",
                        "text-high-contrast": "#0F172A",
                        "surface": "#f7f9fb",
                        "primary-fixed-dim": "#bcc7de",
                        "background": "#f8fafc" // Modified to match Deep Focus base level
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "unit": "8px",
                        "stack-lg": "48px",

                        "margin-page": "24px" // Adjusted for mobile
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],

                    },
                    "fontSize": {

                        "label-sm": ["11px", { "lineHeight": "1", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                },
            }
        }
    </script>
<style>
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<!-- Progress Bar (Top Edge) -->
<div class="w-full h-1 bg-surface-container-high fixed top-0 left-0 z-50">
<div class="h-full bg-primary" style="width: 35%;"></div>
</div>
<!-- Top App Bar -->
<!-- Suppressed TopNavBar JSON due to Task-Focused 'Close' action intent -->
<header class="flex items-center justify-between px-margin-page h-16 mt-1 flex-shrink-0">
<div class="w-8"></div> <!-- Spacer for center alignment -->
<h1 class="font-headline-sm text-headline-sm text-text-high-contrast">Revisão</h1>
<button aria-label="Close session" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-outline group-hover:text-text-high-contrast transition-colors" data-icon="close">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-page py-stack-md flex flex-col items-center justify-center relative w-full max-w-md mx-auto">
<!-- Flashcard Container -->
<div class="w-full flex-1 min-h-0 relative flex items-center justify-center mb-section-gap">
<div class="flip-card w-full aspect-[3/4] max-h-[530px] cursor-pointer" id="flashcard">
<div class="flip-card-inner">
<!-- Front (Question) -->
<div class="flip-card-front bg-surface-alt border border-border-subtle rounded-lg flex flex-col items-center justify-center p-stack-lg shadow-sm">
<div class="absolute top-stack-sm right-stack-sm text-secondary font-label-sm text-label-sm uppercase tracking-widest">Frente</div>
<h2 class="font-headline-md text-headline-md text-text-high-contrast text-center">O que é latência de rede?</h2>
</div>
<!-- Back (Answer) -->
<div class="flip-card-back bg-surface-container-lowest border border-border-subtle rounded-lg flex flex-col items-center justify-center p-stack-lg shadow-sm">
<div class="absolute top-stack-sm right-stack-sm text-secondary font-label-sm text-label-sm uppercase tracking-widest">Verso</div>
<h2 class="font-headline-sm text-headline-sm text-secondary text-center mb-stack-md">O que é latência de rede?</h2>
<div class="w-12 h-[1px] bg-border-subtle mb-stack-md"></div>
<p class="font-body-lg text-body-lg text-text-high-contrast text-center">
                            É o tempo que um pacote de dados leva para viajar de um ponto a outro em uma rede. É frequentemente medida em milissegundos (ms).
                        </p>
</div>
</div>
</div>
</div>
<!-- Controls Area (Fixed Bottom) -->
<div class="fixed bottom-0 left-0 w-full p-margin-page pb-stack-lg bg-background z-10 flex flex-col items-center max-w-md mx-auto right-0">
<!-- Default State: Reveal Button -->
<button class="w-full bg-primary-container text-on-primary h-14 rounded flex items-center justify-center font-label-md text-label-md transition-colors hover:bg-on-secondary-fixed" id="revealBtn">
                Revelar Resposta
            </button>
<!-- Revealed State: Spaced Repetition Buttons -->
<div class="hidden w-full grid-cols-4 gap-unit" id="srsControls">
<button class="h-14 rounded border border-error text-error bg-error-container/10 flex flex-col items-center justify-center font-label-sm text-label-sm transition-colors hover:bg-error-container/20">
<span class="mb-1 text-[10px] text-error/70 font-normal">&lt; 1m</span>
                    Errei
                </button>
<button class="h-14 rounded border border-border-subtle text-text-high-contrast flex flex-col items-center justify-center font-label-sm text-label-sm transition-colors hover:bg-surface-container-low">
<span class="mb-1 text-[10px] text-secondary font-normal">6m</span>
                    Difícil
                </button>
<button class="h-14 rounded border border-border-subtle text-text-high-contrast flex flex-col items-center justify-center font-label-sm text-label-sm transition-colors hover:bg-surface-container-low">
<span class="mb-1 text-[10px] text-secondary font-normal">10m</span>
                    Bom
                </button>
<button class="h-14 rounded border border-primary-container text-primary-container flex flex-col items-center justify-center font-label-sm text-label-sm transition-colors hover:bg-surface-container-low">
<span class="mb-1 text-[10px] text-primary-container/70 font-normal">4d</span>
                    Fácil
                </button>
</div>
</div>
</main>
<!-- Suppressed BottomNavBar JSON due to Task-Focused intent (Review Session) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const flashcard = document.getElementById('flashcard');
            const revealBtn = document.getElementById('revealBtn');
            const srsControls = document.getElementById('srsControls');

            function revealAnswer() {
                flashcard.classList.add('flipped');
                revealBtn.classList.add('hidden');
                srsControls.classList.remove('hidden');
                srsControls.classList.add('grid');
            }

            revealBtn.addEventListener('click', revealAnswer);
            flashcard.addEventListener('click', () => {
                if (!flashcard.classList.contains('flipped')) {
                    revealAnswer();
                }
            });
        });
    </script>
</body></html>

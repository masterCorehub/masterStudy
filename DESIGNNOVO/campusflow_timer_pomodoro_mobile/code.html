<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Focus - Pomodoro Timer</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#38485d",

                    "on-error": "#ffffff",

                    "border-subtle": "#E2E8F0",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#8590a6",
                    "secondary-container": "#d0e1fb",
                    "on-surface": "#191c1e",
                    "on-tertiary-container": "#8291a6",
                    "primary": "#091426",
                    "on-background": "#191c1e",
                    "on-tertiary-fixed": "#0d1c2d",
                    "outline": "#75777d",
                    "surface-alt": "#E8EAF0",
                    "surface-dim": "#d8dadc",
                    "tertiary-fixed": "#d4e4fa",
                    "surface-variant": "#e0e3e5",
                    "surface-container-highest": "#e0e3e5",
                    "inverse-surface": "#2d3133",
                    "surface-container-high": "#e6e8ea",
                    "text-high-contrast": "#0F172A",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#d3e4fe",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-surface-variant": "#45474c",
                    "surface-bright": "#f7f9fb",
                    "on-secondary-container": "#54647a",
                    "inverse-on-surface": "#eff1f3",
                    "surface": "#f7f9fb",
                    "inverse-primary": "#bcc7de",
                    "outline-variant": "#c5c6cd",
                    "primary-fixed-dim": "#bcc7de",
                    "surface-tint": "#545f73",
                    "tertiary-fixed-dim": "#b9c8de",
                    "on-primary-fixed-variant": "#3c475a",
                    "on-tertiary-fixed-variant": "#39485a",
                    "secondary": "#505f76",

                    "tertiary-container": "#1b2a3b",

            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "stack-sm": "12px",
                    "margin-page": "24px",
                    "unit": "8px",
                    "stack-lg": "48px",
                    "stack-md": "24px",
                    "gutter": "16px",
                    "section-gap": "40px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],

                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]

          }
        }
      }

<style>
        .circular-progress {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .circular-progress-circle {
            stroke-dasharray: 879; /* 2 * pi * r (r=140) */
            stroke-dashoffset: 0; /* Adjust this for progress */
            transition: stroke-dashoffset 1s linear;
        }
        
        /* Utility for Material Symbols specific weight if needed */
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-full flex flex-col md:hidden">
<!-- Top AppBar (Mobile) -->
<header class="flex justify-between items-center w-full px-margin-page h-16 bg-surface z-10 shrink-0 border-b border-border-subtle">
<div class="flex-1"></div>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Focus</h1>
<div class="flex-1 flex justify-end">
<button class="p-2 text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-32 px-margin-page flex flex-col items-center pt-stack-md">
<!-- Mode Switcher (Tabs) -->
<div class="w-full max-w-sm flex p-1 bg-surface-alt rounded-lg mb-stack-lg border border-border-subtle">
<button class="flex-1 py-2 px-4 rounded font-label-md text-label-md bg-primary-container text-on-primary text-center transition-colors">Focus</button>
<button class="flex-1 py-2 px-4 rounded font-label-md text-label-md text-secondary hover:bg-surface-container-low text-center transition-colors">Short Break</button>
<button class="flex-1 py-2 px-4 rounded font-label-md text-label-md text-secondary hover:bg-surface-container-low text-center transition-colors">Long Break</button>
</div>
<!-- Timer Area -->
<div class="relative w-72 h-72 mb-stack-lg flex items-center justify-center">
<!-- Circular Progress SVG -->
<svg class="absolute inset-0 w-full h-full circular-progress" viewbox="0 0 300 300">
<!-- Background Circle -->
<circle class="text-surface-alt" cx="150" cy="150" fill="none" r="140" stroke="currentColor" stroke-width="4"></circle>
<!-- Progress Circle -->
<circle class="text-primary circular-progress-circle" cx="150" cy="150" fill="none" r="140" stroke="currentColor" stroke-linecap="round" stroke-width="4" style="stroke-dashoffset: 175;"></circle> <!-- ~20% offset for visual -->
</svg>
<!-- Digital Readout -->
<div class="z-10 flex flex-col items-center">
<span class="font-display-lg text-display-lg text-high-contrast tabular-nums tracking-tight">25:00</span>
<span class="font-label-md text-label-md text-secondary mt-unit uppercase tracking-widest">Remaining</span>
</div>
</div>
<!-- Controls -->
<div class="w-full max-w-xs flex flex-col gap-stack-sm items-center mb-section-gap">
<button class="w-full py-4 px-8 bg-primary text-on-primary rounded font-label-md text-label-md uppercase tracking-wider hover:bg-tertiary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                Start Session
            </button>
<div class="flex gap-gutter w-full justify-center">
<button aria-label="Reset Timer" class="p-3 text-secondary border border-border-subtle rounded hover:bg-surface-alt transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="replay">replay</span>
</button>
<button aria-label="Timer Settings" class="p-3 text-secondary border border-border-subtle rounded hover:bg-surface-alt transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</button>
</div>
</div>
<!-- Task Context Card -->
<div class="w-full max-w-sm bg-surface-alt border border-border-subtle p-stack-md flex items-start gap-stack-sm mb-stack-lg relative overflow-hidden">
<!-- Discipline Accent Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary"></div>
<div class="p-2 bg-surface rounded flex items-center justify-center border border-border-subtle">
<span class="material-symbols-outlined text-secondary" data-icon="edit_document">edit_document</span>
</div>
<div class="flex-1">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block mb-1">Current Task</span>
<h3 class="font-headline-sm text-headline-sm text-high-contrast mb-1">Draft Research Proposal</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-1">Methodology section review and citations.</p>
</div>
</div>
<!-- Statistics -->
<div class="w-full max-w-sm grid grid-cols-2 gap-gutter">
<div class="bg-surface border border-border-subtle p-stack-sm flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-secondary uppercase mb-1">Today's Focus</span>
<span class="font-headline-md text-headline-md text-high-contrast">4.5h</span>
</div>
<div class="bg-surface border border-border-subtle p-stack-sm flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-secondary uppercase mb-1">Cycles Completed</span>
<span class="font-headline-md text-headline-md text-high-contrast">6</span>
</div>
</div>
</main>
<!-- BottomNavBar (Shared Component) -->
<!-- JSON: {"name": "BottomNavBar", "type": "label_icon", "item_count": 4, "labels": ["Home", "Calendar", "Focus", "Profile"], "icons": ["home", "calendar_month", "timer", "person"]} -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe bg-surface dark:bg-on-tertiary-fixed border-t border-border-subtle md:hidden">
<!-- Home: Inactive -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-full h-full" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</a>
<!-- Calendar: Inactive -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-full h-full" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-sm text-label-sm mt-1">Calendar</span>
</a>
<!-- Focus: Active Match -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-full h-full" href="#">
<span class="material-symbols-outlined" data-icon="timer" data-weight="fill">timer</span>
<span class="font-label-sm text-label-sm mt-1">Focus</span>
</a>
<!-- Profile: Inactive -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-full h-full" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
<!-- Safe area padding for standalone web apps on iOS -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</body></html>

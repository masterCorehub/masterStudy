<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusFlow - Tarefas</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {

            theme: {
                extend: {
                    "colors": {
                        "outline": "#75777d",

                        "surface-alt": "#E8EAF0",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed": "#0d1c2d",
                        "on-primary-container": "#8590a6",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed-dim": "#b9c8de",
                        "on-surface": "#191c1e",
                        "primary-container": "#1e293b",
                        "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#3c475a",
                        "on-background": "#191c1e",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#111c2d",
                        "inverse-on-surface": "#eff1f3",
                        "secondary": "#505f76",
                        "primary-fixed": "#d8e3fb",
                        "secondary-container": "#d0e1fb",
                        "inverse-primary": "#bcc7de",
                        "outline-variant": "#c5c6cd",
                        "surface": "#f7f9fb",
                        "on-tertiary-container": "#8291a6",
                        "surface-container": "#eceef0",
                        "on-secondary-fixed": "#0b1c30",
                        "tertiary": "#061525",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",

                    },
                    "spacing": {
                        "stack-md": "24px",
                        "stack-sm": "12px",
                        "stack-lg": "48px",
                        "margin-page": "64px",
                        "unit": "8px",
                        "section-gap": "80px",
                        "gutter": "24px"
                    },
                    "fontFamily": {

                    "fontSize": {

                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-safe">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex flex-col px-gutter bg-surface dark:bg-inverse-surface border-b border-border-subtle dark:border-outline pb-stack-sm pt-stack-sm">
<div class="flex justify-between items-center h-16">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary tracking-tight">Tarefas</h1>
<div class="flex items-center gap-unit">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</div>
</div>
<!-- Search Bar -->
<div class="relative w-full mt-2 mb-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-alt border-none rounded-lg text-body-sm font-body-sm focus:ring-2 focus:ring-primary focus:outline-none placeholder-on-surface-variant text-on-surface" placeholder="Buscar tarefas..." type="text"/>
</div>
<!-- Tabs -->
<div class="flex w-full mt-2">
<button class="flex-1 pb-2 border-b-2 border-primary text-primary font-label-md text-label-md uppercase tracking-wider text-center">Pendentes</button>
<button class="flex-1 pb-2 border-b-2 border-transparent text-on-surface-variant font-label-md text-label-md uppercase tracking-wider text-center hover:text-primary transition-colors">Concluídas</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[160px] pb-24 px-unit flex flex-col gap-unit">
<!-- Date Header -->
<h2 class="font-label-md text-label-md text-on-surface-variant px-unit mt-stack-sm uppercase tracking-wider">Hoje</h2>
<!-- Task Item 1 - High Priority -->
<article class="bg-surface-alt border border-border-subtle rounded-lg p-stack-sm flex items-start gap-stack-sm relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<!-- Accent Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<button class="w-6 h-6 rounded-full border-2 border-outline-variant flex-shrink-0 flex items-center justify-center hover:border-primary transition-colors group-hover:bg-surface">
</button>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-body-md text-body-md text-text-high-contrast font-medium">Finalizar Relatório de Física</h3>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-1 bg-surface rounded-md">Física Aplicada</span>
<span class="font-label-sm text-label-sm text-error flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 14:00</span>
</div>
</div>
</article>
<!-- Task Item 2 - Medium Priority -->
<article class="bg-surface-alt border border-border-subtle rounded-lg p-stack-sm flex items-start gap-stack-sm relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<button class="w-6 h-6 rounded-full border-2 border-outline-variant flex-shrink-0 flex items-center justify-center hover:border-primary transition-colors group-hover:bg-surface">
</button>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-body-md text-body-md text-text-high-contrast font-medium">Estudar Capítulo 4 - Álgebra Linear</h3>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-1 bg-surface rounded-md">Matemática</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 18:30</span>
</div>
</div>
</article>
<!-- Date Header -->
<h2 class="font-label-md text-label-md text-on-surface-variant px-unit mt-stack-md uppercase tracking-wider">Amanhã</h2>
<!-- Task Item 3 - Low Priority -->
<article class="bg-surface-alt border border-border-subtle rounded-lg p-stack-sm flex items-start gap-stack-sm relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary"></div>
<button class="w-6 h-6 rounded-full border-2 border-outline-variant flex-shrink-0 flex items-center justify-center hover:border-primary transition-colors group-hover:bg-surface">
</button>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-body-md text-body-md text-text-high-contrast font-medium">Reunião Grupo de Estudos</h3>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-1 bg-surface rounded-md">Geral</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 10:00</span>
</div>
</div>
</article>
<!-- Task Item 4 -->
<article class="bg-surface-alt border border-border-subtle rounded-lg p-stack-sm flex items-start gap-stack-sm relative overflow-hidden group hover:bg-surface-container-high transition-colors">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-outline"></div>
<button class="w-6 h-6 rounded-full border-2 border-outline-variant flex-shrink-0 flex items-center justify-center hover:border-primary transition-colors group-hover:bg-surface">
</button>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-body-md text-body-md text-text-high-contrast font-medium">Ler Artigo sobre IA Preditiva</h3>
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant px-2 py-1 bg-surface rounded-md">Computação</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">schedule</span> 23:59</span>
</div>
</div>
</article>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-primary text-on-primary rounded-xl shadow-lg flex items-center justify-center hover:bg-primary-container transition-colors z-40">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex md:hidden justify-around items-center h-16 pb-safe bg-surface dark:bg-inverse-surface border-t border-transparent bg-surface dark:bg-inverse-surface">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant w-1/4 h-full active:bg-surface-container-high scale-95 transition-transform duration-200 ease-in-out">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-inverse-primary font-bold w-1/4 h-full active:bg-surface-container-high scale-95 transition-transform duration-200 ease-in-out">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant w-1/4 h-full active:bg-surface-container-high scale-95 transition-transform duration-200 ease-in-out">
<span class="material-symbols-outlined mb-1">event</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant w-1/4 h-full active:bg-surface-container-high scale-95 transition-transform duration-200 ease-in-out">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</body></html>

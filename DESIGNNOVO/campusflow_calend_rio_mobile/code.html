<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CampusFlow - Calendar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                        "outline-variant": "#c5c6cd",
                        "border-subtle": "#E2E8F0",
                        "primary-fixed-dim": "#bcc7de",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#0d1c2d",
                        "surface-tint": "#545f73",
                        "tertiary-container": "#1b2a3b",
                        "on-secondary-container": "#54647a",
                        "surface-alt": "#E8EAF0",
                        "tertiary-fixed-dim": "#b9c8de",
                        "surface-container-high": "#e6e8ea",
                        "tertiary": "#061525",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-fixed": "#d4e4fa",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed": "#d8e3fb",
                        "surface-dim": "#d8dadc",
                        "on-surface-variant": "#45474c",
                        "on-tertiary-fixed-variant": "#39485a",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary": "#505f76",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-fixed-dim": "#b7c8e1",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3e5",
                        "inverse-on-surface": "#eff1f3",
                        "on-surface": "#191c1e",
                        "on-primary-fixed": "#111c2d",
                        "inverse-primary": "#bcc7de",
                        "secondary-container": "#d0e1fb",
                        "primary-container": "#1e293b",
                        "primary": "#091426",
                        "on-tertiary": "#ffffff",
                        "text-high-contrast": "#0F172A",
                        "on-tertiary-container": "#8291a6",
                        "outline": "#75777d",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#8590a6",
                        "on-primary-fixed-variant": "#3c475a",
                        "inverse-surface": "#2d3133"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-lg": "48px",
                        "stack-md": "24px",
                        "unit": "8px",
                        "stack-sm": "12px",
                        "section-gap": "80px",
                        "margin-page": "64px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "1", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Header Section (Sticky) -->
<header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-md border-b border-border-subtle pt-unit pb-stack-sm px-gutter">
<div class="flex justify-between items-center mb-stack-sm">
<h1 class="font-headline-md text-headline-md text-primary">October 2023</h1>
<button class="px-3 py-1.5 rounded-DEFAULT border border-outline-variant text-secondary font-label-md text-label-md hover:bg-surface-container-low transition-colors duration-200">
                Today
            </button>
</div>
<!-- Weekly Strip -->
<div class="flex justify-between items-center px-1">
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">S</span>
<span class="font-body-md text-body-md">15</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="font-label-sm text-label-sm text-primary font-bold uppercase">M</span>
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-body-md text-body-md font-bold">16</div>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">T</span>
<span class="font-body-md text-body-md">17</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">W</span>
<span class="font-body-md text-body-md">18</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">T</span>
<span class="font-body-md text-body-md">19</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">F</span>
<span class="font-body-md text-body-md">20</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-50">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">S</span>
<span class="font-body-md text-body-md">21</span>
</div>
</div>
</header>
<!-- Main Content: Schedule List -->
<main class="flex-1 overflow-y-auto px-gutter py-stack-md pb-32">
<!-- Time Block: 09:00 -->
<div class="relative flex gap-unit mb-stack-md">
<div class="w-12 flex-shrink-0 text-right pt-1">
<span class="font-label-md text-label-md text-on-surface-variant">09:00</span>
</div>
<!-- Timeline Line -->
<div class="absolute left-[3.25rem] top-3 bottom-[-24px] w-px bg-border-subtle z-0"></div>
<div class="flex-1 bg-surface-alt rounded-DEFAULT border border-border-subtle p-stack-sm relative z-10 overflow-hidden">
<!-- Accent Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<h3 class="font-headline-sm text-headline-sm text-primary mb-1">Advanced Calculus</h3>
<div class="flex items-center gap-2 mb-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">location_on</span>
<span class="font-body-sm text-body-sm">Hall B, Science Block</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded border border-outline-variant bg-surface-container-low font-label-sm text-label-sm text-secondary uppercase">
                    Mathematics
                </div>
</div>
</div>
<!-- Time Block: 11:30 -->
<div class="relative flex gap-unit mb-stack-md">
<div class="w-12 flex-shrink-0 text-right pt-1">
<span class="font-label-md text-label-md text-on-surface-variant">11:30</span>
</div>
<!-- Timeline Line -->
<div class="absolute left-[3.25rem] top-3 bottom-[-24px] w-px bg-border-subtle z-0"></div>
<div class="flex-1 bg-surface-alt rounded-DEFAULT border border-border-subtle p-stack-sm relative z-10 overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary"></div>
<h3 class="font-headline-sm text-headline-sm text-primary mb-1">Literature Seminar</h3>
<div class="flex items-center gap-2 mb-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">location_on</span>
<span class="font-body-sm text-body-sm">Room 304, Arts Wing</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded border border-outline-variant bg-surface-container-low font-label-sm text-label-sm text-secondary uppercase">
                    Humanities
                </div>
</div>
</div>
<!-- Current Time Indicator -->
<div class="relative flex gap-unit mb-stack-md items-center py-2">
<div class="w-12 flex-shrink-0 text-right">
<span class="font-label-md text-label-md text-error">12:45</span>
</div>
<!-- Timeline Line Continuous -->
<div class="absolute left-[3.25rem] top-0 bottom-0 w-px bg-border-subtle z-0"></div>
<!-- Current Time Line -->
<div class="absolute left-[3.25rem] w-2 h-2 rounded-full bg-error -ml-1 z-10"></div>
<div class="flex-1 h-px bg-error z-0"></div>
</div>
<!-- Time Block: 14:00 -->
<div class="relative flex gap-unit mb-stack-md">
<div class="w-12 flex-shrink-0 text-right pt-1">
<span class="font-label-md text-label-md text-on-surface-variant">14:00</span>
</div>
<div class="flex-1 bg-surface-alt rounded-DEFAULT border border-border-subtle p-stack-sm relative z-10 overflow-hidden opacity-80">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-outline-variant"></div>
<h3 class="font-headline-sm text-headline-sm text-primary mb-1">Study Group: Physics</h3>
<div class="flex items-center gap-2 mb-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">group</span>
<span class="font-body-sm text-body-sm">Main Library, Floor 2</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded border border-outline-variant bg-surface-container-low font-label-sm text-label-sm text-secondary uppercase">
                    Group Work
                </div>
</div>
</div>
</main>
<!-- Floating Action Button (FAB) -->
<button class="fixed bottom-24 right-6 w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-primary-container transition-colors duration-200 z-40 shadow-sm border border-primary-container active:scale-95">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe bg-surface dark:bg-on-tertiary-fixed border-t border-border-subtle dark:border-outline-variant">
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-16 h-full rounded-DEFAULT">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-16 h-full rounded-DEFAULT">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
<span class="font-label-sm text-label-sm mt-1">Calendar</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-16 h-full rounded-DEFAULT">
<span class="material-symbols-outlined">timer</span>
<span class="font-label-sm text-label-sm mt-1">Focus</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-on-tertiary-container hover:bg-surface-container-low scale-95 active:scale-90 transition-transform w-16 h-full rounded-DEFAULT">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation for Edit Focus -->
<header class="bg-surface w-full h-16 border-b border-border-subtle flex justify-between items-center px-4 md:px-margin-page sticky top-0 z-40">
<button class="p-2 text-secondary hover:bg-surface-container-low rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<span class="font-label-md text-label-md text-secondary">EDITANDO</span>
</div>
<div class="flex gap-2">
<button class="p-2 text-primary hover:bg-surface-container-low rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed" id="ai-action-btn-top">
<span class="material-symbols-outlined fill">auto_awesome</span>
</button>
<button class="p-2 text-secondary hover:bg-surface-container-low rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Editor Area -->
<main class="flex-1 w-full max-w-3xl mx-auto px-6 py-stack-md flex flex-col relative z-0">
<div class="w-full mb-stack-sm border-b border-border-subtle pb-2 focus-within:border-primary transition-colors duration-200">
<input class="w-full bg-transparent font-headline-md text-headline-md text-text-high-contrast border-none focus:ring-0 p-0 placeholder-outline-variant" placeholder="Título da nota" type="text" value="Arquitetura de Sistemas Distribuídos"/>
</div>
<div class="w-full flex-1 flex flex-col mb-24">
<textarea class="w-full flex-1 bg-transparent font-body-lg text-body-lg text-on-surface border-none focus:ring-0 p-0 resize-none placeholder-outline-variant leading-relaxed" placeholder="Comece a digitar..." spellcheck="false">Os sistemas distribuídos são projetados para escalar horizontalmente. Em vez de depender de um único servidor poderoso (escalabilidade vertical), a carga é dividida entre várias máquinas menores.

Principais desafios:
- Consistência de dados: Garantir que todos os nós vejam a mesma informação ao mesmo tempo. O Teorema CAP (Consistency, Availability, Partition tolerance) afirma que um sistema distribuído pode garantir no máximo duas dessas três propriedades simultaneamente.
- Tolerância a falhas: O sistema deve continuar funcionando mesmo se um ou mais componentes falharem. Isso geralmente envolve replicação de dados e redundância.
- Latência de rede: A comunicação entre nós introduz atrasos imprevisíveis que devem ser mitigados através de caching e processamento assíncrono.

Padrões comuns incluem arquiteturas orientadas a eventos (EDA) e microserviços. Em uma EDA, serviços reagem a mudanças de estado em vez de fazer chamadas síncronas diretas.</textarea>
</div>
</main>
<!-- Floating Action Button (Mobile Only - AI Trigger) -->
<button class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-primary-container text-on-primary-container rounded-full shadow-sm flex items-center justify-center hover:bg-tertiary-container transition-colors focus:outline-none focus:ring-4 focus:ring-primary-fixed-dim z-30" id="ai-fab">
<span class="material-symbols-outlined fill">auto_awesome</span>
</button>
<!-- Bottom Sheet Overlay -->
<div class="overlay fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50" id="bottom-sheet-overlay"></div>
<!-- AI Bottom Sheet -->
<div class="bottom-sheet fixed bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-xl border-t border-border-subtle z-50 md:w-96 md:left-auto md:right-margin-page md:bottom-24 md:rounded-xl md:border md:shadow-lg" id="ai-bottom-sheet">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center py-3 md:hidden cursor-grab active:cursor-grabbing" id="sheet-handle">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-6 pb-8 pt-2 md:pt-6">
<div class="flex items-center gap-3 mb-6">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined fill text-[20px]">auto_awesome</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-text-high-contrast">Ferramentas de IA</h3>
</div>
<div class="flex flex-col gap-2">
<!-- Action Buttons: Secondary Ghost style as per design system -->
<button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg border border-secondary text-secondary bg-transparent hover:bg-surface-container-low transition-colors text-left focus:outline-none focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined text-[20px]">summarize</span>
<span class="font-body-md text-body-md font-medium">Resumir Nota</span>
</button>
<button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg border border-secondary text-secondary bg-transparent hover:bg-surface-container-low transition-colors text-left focus:outline-none focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined text-[20px]">view_carousel</span>
<span class="font-body-md text-body-md font-medium">Criar Flashcards</span>
</button>
<button class="w-full flex items-center gap-4 px-4 py-3 rounded-lg border border-secondary text-secondary bg-transparent hover:bg-surface-container-low transition-colors text-left focus:outline-none focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined text-[20px]">lightbulb</span>
<span class="font-body-md text-body-md font-medium">Extrair Conceitos Chave</span>
</button>
</div>
<button class="w-full mt-6 py-3 rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md hover:bg-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container md:hidden" id="close-sheet-btn">
                FECHAR
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('ai-bottom-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            const fab = document.getElementById('ai-fab');
            const topBtn = document.getElementById('ai-action-btn-top');
            const closeBtn = document.getElementById('close-sheet-btn');

            function openSheet() {
                sheet.classList.add('open');
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            }

            function closeSheet() {
                sheet.classList.remove('open');
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            fab.addEventListener('click', openSheet);
            if(topBtn) topBtn.addEventListener('click', openSheet);
            closeBtn.addEventListener('click', closeSheet);
            overlay.addEventListener('click', closeSheet);
        });
    </script>
</body></html>

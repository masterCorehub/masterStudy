<body class="bg-background text-on-background h-full flex flex-col font-body-md antialiased md:hidden">
<!-- Top App Bar -->

<!-- Section: General -->

</div>

</div>
<!-- Item: Privacidade -->
<div class="flex items-center justify-between p-4 cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary" data-icon="shield">shield</span>
<span class="font-body-md text-body-md text-on-background">Privacidade</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
<!-- Section: Preferences -->

<div class="flex items-center justify-between p-4 border-b border-border-subtle">

</div>
</div>
<!-- Minimalist Toggle -->
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-border-subtle appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10 top-0 left-0" id="toggle-notifications" name="toggle" type="checkbox"/>

</div>
</div>
<!-- Minimalist Toggle -->
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-border-subtle appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10 top-0 left-0" id="toggle-focus" name="toggle" type="checkbox"/>

                Sair da Conta
            </button>

<!-- Bottom Navigation Bar (Semantic Shell Rule: Excluded on Settings) -->
<!-- As per the Semantic Shell Mandate: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow. Settings, Profile, Details, and Transactional screens." 
    Therefore, no Bottom Nav is rendered on this Settings screen. -->
<script>
        // Simple toggle logic for the custom UI
        const toggles = document.querySelectorAll('.toggle-checkbox');
        toggles.forEach(toggle => {
            toggle.addEventListener('change', function() {
                if(this.checked) {
                   this.style.transform = 'translateX(100%)';
                } else {
                   this.style.transform = 'translateX(0)';
                }
            });
            // Initial state
            if(toggle.checked) {
                toggle.style.transform = 'translateX(100%)';
            }
        });
    </script>

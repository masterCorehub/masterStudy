<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1318; color: #e2e8f0; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header */
    .header { padding: 12px 14px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #131822; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: #38bdf8; }
    .logo-badge { background: #0284c7; color: white; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; }
    .btn-save { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
    .btn-save:hover { background: #059669; transform: scale(1.02); }
    .btn-save.saved { background: #3b82f6; }

    /* Content Card */
    .meta-card { padding: 12px 14px; display: flex; gap: 12px; border-bottom: 1px solid #1e293b; background: #18202c; }
    .thumb { width: 72px; height: 48px; border-radius: 8px; object-cover: cover; background: #242f3d; flex-shrink: 0; }
    .meta-info { flex-1; min-width: 0; }
    .title { font-weight: 700; font-size: 13px; line-height: 1.3; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc; }
    .tag-list { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { background: #2a3749; color: #94a3b8; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }

    /* Tabs */
    .nav-tabs { display: flex; padding: 4px 10px; border-bottom: 1px solid #1e293b; background: #131822; gap: 4px; }
    .nav-tab { background: none; border: none; color: #94a3b8; padding: 6px 10px; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .nav-tab.active { background: #1e293b; color: #38bdf8; }

    /* Body */
    .main-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Summary Mode Pill */
    .summary-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .summary-toggle { display: flex; background: #18202c; border: 1px solid #2a3749; border-radius: 8px; padding: 2px; }
    .summary-btn { background: none; border: none; color: #94a3b8; padding: 4px 8px; font-size: 10px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .summary-btn.active { background: #0284c7; color: white; }

    /* Summary Card */
    .summary-content { background: #18202c; border: 1px solid #243040; border-radius: 12px; padding: 12px; line-height: 1.5; font-size: 12px; color: #cbd5e1; }
    .summary-content ul { padding-left: 16px; margin-top: 6px; }
    .summary-content li { margin-bottom: 6px; }

    /* Timestamps */
    .timestamp-pill { display: inline-block; background: #0284c7; color: white; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-family: monospace; font-weight: 700; cursor: pointer; margin-right: 4px; text-decoration: none; }
    .timestamp-pill:hover { background: #0369a1; }

    /* Chat Area */
    .chat-container { border-top: 1px solid #1e293b; padding: 10px; background: #131822; }
    .chat-input-box { display: flex; gap: 6px; background: #18202c; border: 1px solid #2a3749; border-radius: 10px; padding: 6px 10px; align-items: center; }
    .chat-input { flex: 1; background: none; border: none; color: white; font-size: 12px; outline: none; }
    .btn-send { background: #0284c7; border: none; color: white; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    .status-toast { font-size: 10px; color: #10b981; text-align: center; margin-top: 4px; display: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span class="logo-badge">STUDYHUB</span>
      <span>Knowledge Recall</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="btnSaveToApp" class="btn-save">
        <span>Salvar no StudyHub</span>
      </button>
      <button id="btnClosePanel" style="background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px;" title="Fechar Painel">✕</button>
    </div>
  </div>

  <!-- Meta Card -->
  <div class="meta-card">
    <img id="pageThumb" class="thumb" src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=200" alt="Thumbnail" />
    <div class="meta-info">
      <div id="pageTitle" class="title">Carregando conteúdo...</div>
      <div id="tagContainer" class="tag-list">
        <span class="tag">Web</span>
        <span class="tag">+ tag</span>
      </div>
    </div>
  </div>

  <!-- Sub Tabs -->
  <div class="nav-tabs">
    <button id="tabSummary" class="nav-tab active">Resumo IA</button>
    <button id="tabTranscript" class="nav-tab">Transcrição</button>
    <button id="tabChat" class="nav-tab">Chat</button>
  </div>

  <!-- Body -->
  <div class="main-body">
    <div id="summaryControls" class="summary-controls">
      <div class="summary-toggle">
        <button id="btnConcise" class="summary-btn active">Conciso</button>
        <button id="btnDetailed" class="summary-btn">Detalhado</button>
      </div>
    </div>

    <!-- Summary Display -->
    <div id="summaryText" class="summary-content">
      Extraindo dados e gerando análise com IA...
    </div>

    <div id="toastMessage" class="status-toast">
      ✓ Conteúdo sincronizado com sucesso no StudyHub Desktop!
    </div>
  </div>

  <!-- Bottom Chat Bar -->
  <div class="chat-container">
    <div class="chat-input-box">
      <input id="chatInput" type="text" class="chat-input" placeholder="Pergunte qualquer coisa... digite @ para contexto" />
      <button id="btnSendChat" class="btn-send">➔</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>masterStudy — Conteúdos</title><style>
*{box-sizing:border-box}body{margin:0;background:#19120e;color:#eee5dc;font:14px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #49382b}main{padding:16px}button,input,select{font:inherit;border:1px solid #594433;border-radius:9px;padding:9px;background:#2b2019;color:inherit}button{cursor:pointer}button:hover{border-color:#f4b76c}button:disabled{opacity:.5;cursor:wait}.primary{background:#f4b76c;color:#251a11}h1{font-size:18px;line-height:1.4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}label{display:block;margin:14px 0 6px}input,select{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6;background:#271d17;padding:12px;border-radius:10px}#status{color:#f4b76c;line-height:1.5}small{color:#b7a99b}section{margin:20px 0}#questionArea[hidden],#transcript[hidden]{display:none}
</style></head><body><header><strong>masterStudy</strong><button id="close" aria-label="Fechar painel">✕</button></header><main><h1 id="title">Obtendo conteúdo da página…</h1><small>Nada é gerado automaticamente. A IA usa o provedor configurado no app Desktop.</small><div class="actions"><button id="summary">Gerar resumo</button><button id="question">Perguntar sobre o conteúdo</button><button id="transcriptButton" hidden>Ver transcrição</button></div><section id="questionArea" hidden><input id="questionInput" placeholder="O que você quer entender?"><button id="ask">Enviar pergunta</button></section><pre id="result" hidden></pre><pre id="transcript" hidden></pre><label for="tags">Tags (separadas por vírgula)</label><input id="tags" placeholder="Ex.: programação, interfaces"><div class="actions"><button id="generateTags">Gerar tags com IA</button></div><label for="folder">Pasta de conteúdos</label><input id="folder" placeholder="Ex.: Desenvolvimento web" list="folders"><datalist id="folders"></datalist><div class="actions"><button id="save" class="primary">Adicionar aos conteúdos</button></div><p id="status" role="status"></p></main><script src="sidepanel.js"></script></body></html>
